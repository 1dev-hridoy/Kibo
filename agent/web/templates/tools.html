<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kibo — Tools</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <link href="/static/css/tools.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg px-3 py-2 mb-3">
    <div class="container-fluid p-0">
      <a class="navbar-brand" href="/"><i class="bi bi-robot"></i> Kibo</a>
      <div class="d-flex align-items-center gap-2">
        <span class="badge rounded-pill badge-model" id="tool-count">Loading...</span>
        <a href="/" class="btn btn-sm btn-primary btn-tool"><i class="bi bi-chat-dots"></i> Chat</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 pb-4">
    <div class="card p-3">
      <div class="d-flex flex-column flex-sm-row gap-2 align-items-sm-center mb-2">
        <div class="fw-semibold"><i class="bi bi-grid"></i> All tools</div>
        <div class="flex-sm-grow-1">
          <input id="tool-search" class="form-control form-control-sm" placeholder="Search tools...">
        </div>
      </div>
      <div id="tool-list">
        <div class="text-muted mt-3">Loading tools...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/tools.js"></script>
</body>
</html>
