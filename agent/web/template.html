<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kibo</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
        <style>
            body {
                max-width: 880px;
                margin: 0 auto;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }
            header h1 {
                margin: 0;
            }
            #msgs {
                min-height: 45vh;
                max-height: 55vh;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 0.9rem;
                padding: 1rem;
                margin: 1rem 0;
                border: 1px solid var(--border);
                border-radius: 6px;
            }
            .msg {
                max-width: 85%;
            }
            .msg.user {
                align-self: flex-end;
            }
            .msg.agent {
                align-self: flex-start;
                max-width: 95%;
            }
            .msg .who {
                font-size: 0.7rem;
                opacity: 0.7;
                margin-bottom: 0.2rem;
            }
            .msg .bubble {
                padding: 0.6rem 0.9rem;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: var(--background-alt);
            }
            .msg.user .bubble {
                background: var(--button-base);
                color: #fff;
            }
            form.chat {
                display: flex;
                gap: 0.6rem;
            }
            form.chat input {
                flex: 1;
                margin: 0;
            }
            form.chat button {
                margin: 0;
            }
            .qa {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.5rem;
            }
            .qa button {
                margin: 0;
                font-size: 0.78rem;
                padding: 0.45rem 0.6rem;
                text-align: left;
            }
            details {
                margin-top: 0.4rem;
                font-size: 0.78rem;
            }
            details pre {
                margin: 0.3rem 0 0;
                white-space: pre-wrap;
            }
            footer {
                font-size: 0.75rem;
                opacity: 0.75;
                margin-top: 1rem;
            }
            .model-badge {
                display: inline-block;
                padding: 0.2rem 0.5rem;
                border-radius: 4px;
                background: var(--button-base);
                color: #fff;
                font-size: 0.7rem;
                cursor: pointer;
                margin-left: 0.5rem;
            }
            .model-badge:hover {
                opacity: 0.8;
            }
            .toolbar {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin-bottom: 0.5rem;
            }
            .toolbar button {
                font-size: 0.75rem;
                padding: 0.3rem 0.6rem;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Kibo</h1>
            <span
                >Online — <span id="model-name">Loading...</span>
                <span class="model-badge" onclick="showModelPicker()">Switch Model</span></span
            >
        </header>

        <div class="toolbar">
            <button onclick="clearChat()">Clear Chat</button>
            <button onclick="loadHistory()">Load History</button>
            <button onclick="document.getElementById('screen-dialog').showModal()">Live Screen</button>
            <button onclick="openTerminal()">Terminal</button>
            <button onclick="document.getElementById('macro-dialog').showModal()">Macros</button>
        </div>

        <div id="msgs">
            <div class="msg agent">
                <div class="who">Kibo</div>
                <div class="bubble">Ready. Tell me what to do on this PC — I understand natural language.</div>
            </div>
        </div>

        <form class="chat" id="chat">
            <input
                id="input"
                placeholder="e.g. set volume to 80, take screenshot, list processes..."
                autocomplete="off"
            />
            <button type="submit">Send</button>
        </form>

        <h3>Quick actions</h3>
        <div class="qa">
            <button onclick="sendCmd('Check battery status')">Battery</button>
            <button onclick="sendCmd('Get volume levels')">Volume level</button>
            <button onclick="sendCmd('Make the sound 100%')">Volume 100%</button>
            <button onclick="sendCmd('Set brightness to 80')">Brightness 80%</button>
            <button onclick="sendCmd('Take a screenshot')">Screenshot</button>
            <button onclick="sendCmd('Lock the screen')">Lock screen</button>
            <button onclick="sendCmd('WiFi info')">WiFi info</button>
            <button onclick="sendCmd('Scan WiFi networks')">WiFi scan</button>
            <button onclick="sendCmd('Show device info')">PC info</button>
            <button onclick="sendCmd('System info')">System info</button>
            <button onclick="sendCmd('Show CPU and RAM usage')">CPU / RAM</button>
            <button onclick="sendCmd('Take a photo')">Webcam photo</button>
            <button onclick="sendCmd('Copy hello to clipboard')">Clipboard set</button>
            <button onclick="sendCmd('Open YouTube')">YouTube</button>
            <button onclick="sendCmd('Download https://example.com')">Download</button>
            <button onclick="sendCmd('Show a notification saying done')">Notify</button>
            <button onclick="sendCmd('What time is it')">Time</button>
            <button onclick="sendCmd('List files in home directory')">Files</button>
            <button onclick="sendCmd('List installed apps')">Installed apps</button>
            <button onclick="sendCmd('Show running processes')">Processes</button>
            <button onclick="sendCmd('Show disk usage')">Disk usage</button>
            <button onclick="sendCmd('Show system temperature')">Temperature</button>
            <button onclick="sendCmd('View system logs')">System logs</button>
            <button onclick="sendCmd('Read file /etc/hostname')">Read file</button>
            <button onclick="sendCmd('What tools do you have')">All tools</button>
        </div>

        <footer>
            Themed by <a href="https://watercss.kognise.dev/">water.css</a> &middot; Local AI &middot; nothing leaves
            this device
        </footer>

        <!-- Model Picker Modal -->
        <dialog id="model-dialog">
            <h3>Switch Model</h3>
            <div id="model-list"></div>
            <br />
            <button onclick="document.getElementById('model-dialog').close()">Cancel</button>
        </dialog>

        <!-- Live Screen Modal -->
        <dialog id="screen-dialog">
            <h3>Live Screen</h3>
            <div style="text-align: center">
                <img
                    id="live-screen"
                    src="/api/screenshot"
                    style="max-width: 100%; border-radius: 6px; cursor: pointer"
                    onclick="refreshScreen()"
                    title="Click to refresh"
                />
                <br /><br />
                <button onclick="toggleLiveView()" id="live-btn">Start Live View</button>
                <button onclick="refreshScreen()">Refresh</button>
                <button onclick="document.getElementById('screen-dialog').close()">Close</button>
            </div>
        </dialog>

        <dialog id="terminal-dialog">
            <h3>Terminal</h3>
            <div
                id="terminal-container"
                style="
                    background: #1e1e1e;
                    color: #d4d4d4;
                    padding: 10px;
                    border-radius: 6px;
                    font-family: monospace;
                    font-size: 13px;
                    height: 400px;
                    overflow-y: auto;
                    white-space: pre-wrap;
                "
            ></div>
            <br />
            <div style="display: flex; gap: 0.5rem">
                <input
                    id="terminal-input"
                    placeholder="Type command..."
                    style="flex: 1; font-family: monospace"
                    onkeydown="
                        if (event.key === 'Enter') {
                            sendTerminalInput();
                            event.preventDefault();
                        }
                    "
                />
                <button onclick="sendTerminalInput()">Send</button>
                <button onclick="document.getElementById('terminal-dialog').close()">Close</button>
            </div>
        </dialog>

        <dialog id="macro-dialog">
            <h3>Macros</h3>
            <div id="macro-list" style="margin-bottom: 1rem">Loading...</div>
            <div style="display: flex; gap: 0.5rem">
                <input id="macro-name" placeholder="Macro name" />
                <button onclick="startMacroRec()">Record</button>
                <button onclick="stopMacroRec()">Stop</button>
            </div>
            <br />
            <button onclick="document.getElementById('macro-dialog').close()">Close</button>
        </dialog>

        <script>
            const msgs = document.getElementById("msgs");
            const input = document.getElementById("input");
            const HISTORY_KEY = "kibo_chat_history";

            async function loadModel() {
                try {
                    const res = await fetch("/api/model");
                    const data = await res.json();
                    document.getElementById("model-name").textContent = data.name + " (" + data.size + ")";
                } catch (e) {}
            }

            async function showModelPicker() {
                const dialog = document.getElementById("model-dialog");
                const list = document.getElementById("model-list");
                list.innerHTML = "Loading...";
                dialog.showModal();

                try {
                    const res = await fetch("/api/models");
                    const data = await res.json();
                    list.innerHTML = "";
                    data.models.forEach(m => {
                        const btn = document.createElement("button");
                        btn.style.display = "block";
                        btn.style.width = "100%";
                        btn.style.margin = "0.3rem 0";
                        btn.style.textAlign = "left";
                        btn.innerHTML =
                            (m.active ? "● " : "○ ") +
                            m.name +
                            " (" +
                            m.size +
                            ")" +
                            (m.available ? "" : " [Not downloaded]");
                        btn.disabled = !m.available || m.active;
                        btn.onclick = async () => {
                            await fetch("/api/model", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ model: m.key }),
                            });
                            dialog.close();
                            loadModel();
                            addMsg("Kibo", "agent", "Switched to " + m.name);
                        };
                        list.appendChild(btn);
                    });
                } catch (e) {
                    list.innerHTML = "Error loading models";
                }
            }

            function saveHistory() {
                const messages = [];
                msgs.querySelectorAll(".msg").forEach(el => {
                    const who = el.querySelector(".who")?.textContent || "";
                    const bubble = el.querySelector(".bubble")?.textContent || "";
                    messages.push({ who, bubble, cls: el.className });
                });
                localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
            }

            function loadHistory() {
                const saved = localStorage.getItem(HISTORY_KEY);
                if (!saved) return;
                try {
                    const messages = JSON.parse(saved);
                    msgs.innerHTML = "";
                    messages.forEach(m => {
                        const d = document.createElement("div");
                        d.className = m.cls;
                        d.innerHTML =
                            '<div class="who">' + esc(m.who) + '</div><div class="bubble">' + esc(m.bubble) + "</div>";
                        msgs.appendChild(d);
                    });
                    msgs.scrollTop = msgs.scrollHeight;
                } catch (e) {}
            }

            function clearChat() {
                msgs.innerHTML = "";
                localStorage.removeItem(HISTORY_KEY);
                addMsg("Kibo", "agent", "Chat cleared. Ready for new commands.");
            }

            function esc(s) {
                const d = document.createElement("div");
                d.textContent = s == null ? "" : String(s);
                return d.innerHTML;
            }

            function addMsg(who, cls, html) {
                const d = document.createElement("div");
                d.className = "msg " + cls;
                d.innerHTML =
                    '<div class="who">' +
                    who +
                    " &middot; " +
                    new Date().toLocaleTimeString() +
                    '</div><div class="bubble">' +
                    html +
                    "</div>";
                msgs.appendChild(d);
                msgs.scrollTop = msgs.scrollHeight;
                saveHistory();
            }

            function sendCmd(text) {
                input.value = text;
                document.getElementById("chat").requestSubmit();
            }

            document.getElementById("chat").addEventListener("submit", async e => {
                e.preventDefault();
                const text = input.value.trim();
                if (!text) return;
                addMsg("You", "user", esc(text));
                input.value = "";
                try {
                    const res = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text }),
                    });
                    const data = await res.json();
                    if (data.error) {
                        addMsg("Kibo", "agent", "Error: " + esc(data.error));
                        return;
                    }
                    let html = esc(data.response || "...");
                    if (data.media && data.media.url) {
                        html +=
                            '<br><img src="' +
                            esc(data.media.url) +
                            '" alt="' +
                            esc(data.media.type) +
                            '" style="max-width:100%;border-radius:6px;margin-top:0.5rem;cursor:pointer" onclick="window.open(this.src)">';
                    }
                    if (data.tools && data.tools.length) {
                        html +=
                            "<details><summary>" +
                            data.tools.length +
                            " tool call" +
                            (data.tools.length > 1 ? "s" : "") +
                            "</summary><pre><code>" +
                            esc(data.tools.join("\n")) +
                            "</code></pre></details>";
                    }
                    addMsg("Kibo", "agent", html);
                } catch (err) {
                    addMsg("Kibo", "agent", "Error: " + esc(err.message));
                }
            });

            loadModel();
            loadHistory();

            let liveInterval = null;

            function refreshScreen() {
                const img = document.getElementById("live-screen");
                img.src = "/api/screenshot?t=" + Date.now();
            }

            function toggleLiveView() {
                const btn = document.getElementById("live-btn");
                if (liveInterval) {
                    clearInterval(liveInterval);
                    liveInterval = null;
                    btn.textContent = "Start Live View";
                } else {
                    liveInterval = setInterval(refreshScreen, 2000);
                    btn.textContent = "Stop Live View";
                    refreshScreen();
                }
            }

            let termSocket = null;
            let termConnected = false;

            function openTerminal() {
                document.getElementById("terminal-dialog").showModal();
                if (!termConnected) {
                    connectTerminal();
                }
            }

            function connectTerminal() {
                termSocket = io();
                termSocket.on("connect", () => {
                    termConnected = true;
                    termSocket.emit("terminal:create", { cols: 80, rows: 24 });
                });
                termSocket.on("terminal:created", data => {
                    addTerminalOutput("Terminal session: " + data.session_id + "\n");
                });
                termSocket.on("terminal:output", data => {
                    addTerminalOutput(data.output);
                });
                termSocket.on("disconnect", () => {
                    termConnected = false;
                });
            }

            function addTerminalOutput(text) {
                const container = document.getElementById("terminal-container");
                container.textContent += text;
                container.scrollTop = container.scrollHeight;
            }

            function sendTerminalInput() {
                const input = document.getElementById("terminal-input");
                const text = input.value;
                if (text && termSocket) {
                    termSocket.emit("terminal:input", { input: text + "\n" });
                    input.value = "";
                }
            }

            let macroRecording = false;

            async function loadMacros() {
                try {
                    const res = await fetch("/api/macros");
                    const data = await res.json();
                    const list = document.getElementById("macro-list");
                    if (!data.macros || data.macros.length === 0) {
                        list.textContent = "No macros saved";
                        return;
                    }
                    list.innerHTML = "";
                    data.macros.forEach(m => {
                        const btn = document.createElement("button");
                        btn.textContent = m.name + " (" + m.steps + " steps)";
                        btn.onclick = () => replayMacro(m.name);
                        btn.style.display = "block";
                        btn.style.width = "100%";
                        btn.style.margin = "0.2rem 0";
                        list.appendChild(btn);
                    });
                } catch (e) {
                    document.getElementById("macro-list").textContent = "Error loading macros";
                }
            }

            async function startMacroRec() {
                const name = document.getElementById("macro-name").value.trim();
                if (!name) {
                    alert("Enter a macro name");
                    return;
                }
                await fetch("/api/macros/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name }),
                });
                macroRecording = true;
                addMsg("Kibo", "agent", "Recording macro: " + name);
            }

            async function stopMacroRec() {
                await fetch("/api/macros/stop", { method: "POST" });
                macroRecording = false;
                addMsg("Kibo", "agent", "Macro recording stopped");
                loadMacros();
            }

            async function replayMacro(name) {
                await fetch("/api/macros/replay", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name }),
                });
                addMsg("Kibo", "agent", "Replaying macro: " + name);
            }

            document.getElementById("macro-dialog").addEventListener("open", loadMacros);
        </script>
    </body>
</html>
